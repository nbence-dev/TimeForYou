# TimeForYou — the whole stack on one machine. Owned by V6 (platform).
# CONTRIBUTING.md §4: request changes here, don't edit it in passing.
#
# One promise: a marker with Docker Desktop and nothing else clones the repo,
# copies .env.example to .env, runs `docker compose up`, and gets the entire
# pipeline — auth, polling, change detection, notification delivery — on one
# machine with no Eduvos credentials (brief §12.4).
#
# `cloudflared` is behind the `tunnel` profile on purpose: the marker's .env
# has no real CLOUDFLARE_TUNNEL_TOKEN (team instance only, brief §12.4), and a
# bare `docker compose up` must not fail or hang waiting on it. The team runs
# `docker compose --profile tunnel up` to add it on the machine that actually
# has the token.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: TimeForYou.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__TimeForYou: ${ConnectionStrings__TimeForYou}
      AES_KEY: ${AES_KEY}
      WEBUNTIS_BASE_URL: ${WEBUNTIS_BASE_URL}
      WEBUNTIS_SCHOOL: ${WEBUNTIS_SCHOOL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH}:${GOOGLE_APPLICATION_CREDENTIALS}:ro
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_healthy

  worker:
    build:
      context: ./server
      dockerfile: TimeForYou.Worker/Dockerfile
    environment:
      ConnectionStrings__TimeForYou: ${ConnectionStrings__TimeForYou}
      AES_KEY: ${AES_KEY}
      WEBUNTIS_BASE_URL: ${WEBUNTIS_BASE_URL}
      WEBUNTIS_SCHOOL: ${WEBUNTIS_SCHOOL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}
      WEB_APP_URL: ${WEB_APP_URL:-}
    # POST /nudge and the Hangfire dashboard: LAN-only and unauthenticated on purpose.
    # Never add this to the cloudflared tunnel config.
    ports:
      - "${WORKER_PORT:-8081}:8081"
    # The aspnet image has no curl/wget, so speak HTTP to /healthz over bash's /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH}:${GOOGLE_APPLICATION_CREDENTIALS}:ro
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_healthy

  mock:
    build:
      context: ./mock
    environment:
      # Target of the /demo page's "Nudge now" button (the mock proxies to the worker).
      WORKER_NUDGE_URL: ${WORKER_NUDGE_URL:-http://worker:8081/nudge}
    ports:
      - "8000:8000"
    # Admin endpoints are unauthenticated on purpose — the mock is never
    # tunnelled, so the LAN is the boundary. Do not add a token.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  db-data:
